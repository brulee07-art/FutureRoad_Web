      <g fill="white"><rect x="7" y="5" width="13" height="15" rx="3"/><rect x="8" y="17" width="2.6" height="5" rx="1"/><rect x="17" y="17" width="2.6" height="5" rx="1"/></g>
      <rect x="9" y="8" width="9" height="5.5" rx="1" fill="#145779"/>
      <g fill="#145779"><circle cx="10" cy="16.5" r="1"/><circle cx="17" cy="16.5" r="1"/></g>
    </g>
  </defs>
