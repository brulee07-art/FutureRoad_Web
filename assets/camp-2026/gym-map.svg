<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="480" height="496" viewBox="0 -22 480 496" role="img" aria-labelledby="title desc" lang="ko">
  <title id="title">광덕고등학교 체육관과 정문·후문, 염주맨션 버스 정류장 안내</title>
  <desc id="desc">차량은 반드시 그림 위쪽 광덕중학교 쪽 정문을 이용하세요. 아래쪽 염화로에 면한 체육관 쪽 후문은 보행자 전용으로 차량 진입이 금지됩니다. 파란색 건물이 캠프 체육관입니다. 후문 앞 염화로의 학교 쪽에 염주맨션 2290번 정류장(염주사거리 방면)이, 길 건너편에 염주맨션 2303번 정류장(화정중·주월초교 방면)이 있습니다.</desc>
